[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-circle-skills"
version = "0.1.0"
description = "Prompt Circle skills repository with shared utilities"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "hollaugo", email = ""}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]

[project.scripts]
build-packages = "scripts.build_packages:main"
validate-manifest = "scripts.validate_manifest:main"

[tool.ruff]
# Enable Pyflakes (F), pycodestyle (E), isort (I), pep8-naming (N), flake8-bugbear (B)
# pylint (P), flake8-quotes (Q), flake8-builtins (A), flake8-comprehensions (C)
# flake8-pie (PIE), flake8-return (RET), flake8-simplify (SIM), pyupgrade (UP)
select = ["E", "F", "I", "N", "W", "UP", "B", "C", "SIM", "PIE", "RET"]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

# Allow autofix for all enabled rules (when --fix is used)
fixable = ["ALL"]
unfixable = []

# Same as Black.
line-length = 100
indent-width = 4

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^_+$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, not tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_signature_compatibility = true
warn_incomplete_stub = true
check_untyped_defs = true
strict_optional = true
warn_no_return = true
warn_unreachable = true

# Ignore missing imports for third-party libraries
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = "tests/*.py"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.bandit]
skips = ["B101"]  # assert_used - we use assertions in tests
