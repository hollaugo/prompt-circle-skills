name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort markdownlint-cli2

      - name: Validate SKILL.md files
        run: |
          # Check that all skills have a SKILL.md
          for skill_dir in skills/*/; do
            if [ ! -f "${skill_dir}SKILL.md" ]; then
              echo "::error::Missing SKILL.md in ${skill_dir}"
              exit 1
            fi
          done
          # Check that all skills in manifest exist
          python -c "
import json, os
with open('manifests/skills.json') as f:
    manifest = json.load(f)
for skill in manifest['skills']:
    source_path = skill['source_path']
    if not os.path.isdir(source_path):
        print(f'::error::Source path {source_path} does not exist')
        exit(1)
    if not os.path.isfile(f'{source_path}/SKILL.md'):
        print(f'::error::SKILL.md missing in {source_path}')
        exit(1)
"

      - name: Lint Python code
        run: |
          black --check .
          isort --check .

      - name: Lint Markdown
        run: |
          markdownlint **/*.md --ignore docs/plans/ --ignore skills/*/references/

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
